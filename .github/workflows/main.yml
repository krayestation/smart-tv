name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle fonts into the app
        run: python3 scripts/fetch_fonts.py app/src/main/assets/fonts || echo "Font download failed - the app will use fallback fonts"

      - name: Build
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk smart-tv.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: smart-tv.apk
          make_latest: true
